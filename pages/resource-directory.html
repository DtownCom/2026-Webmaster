<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Directory – Downingtown Community Resource Hub</title>
  <link rel="stylesheet" href="default.css">
  <link rel="stylesheet" href="../index.css">
</head>

<body>

  <!-- HEADER -->
    <header class="main-header">
        <div class="top-bar">
            <div class="logo">
                <img src="../images/logo.png" alt="Logo" class="logo-img">
            </div>
            <div class="logo-title">
                Downingtown Area
            </div>
            <nav class="top-nav">
                <a href="../index.html">Home</a>
                <a href="resource-directory.html">Resource Directory</a>
            </nav>
        </div>
    </header>

  <!-- HERO SECTION -->
    <section class="hero-resources">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-heading">Resource Directory</h1>
            <p class="hero-subheading">Can't find something? Look here or use the search bar!</p>
        </div>
    </section>

  <!-- MAIN CONTENT -->
    <main>

        <h1 class="page-title">Resource Directory</h1>

        <!-- Search + Filters -->
        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search resources...">
            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="food">Food Security</option>
                option value="housing">Housing & Shelter</option>
                <option value="health">Health</option>
                <option value="education">Education</option>
                <option value="transportation">Transportation</option>
                <option value="volunteering">Volunteering</option>
            </select>
        </div>

        <!-- Dynamic Resource List -->
        <div id="resourceList" class="resource-list"></div>

    </main>

  <!-- FOOTER -->
    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="refrences.html" class="cta-btn">References</a>
                <a href="FeedbackSuggestions.html" class="cta-btn">Feedback & Suggestions</a>
            </div>
        </div>

        <p>2026 Downingtown Community Resource Hub</p>
    </footer>

        <script src="../index.js"></script>
</body>
</html>
